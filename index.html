<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunil FF Pro - Master Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, updateDoc, serverTimestamp, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config (Directly Integrated) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
            authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
            projectId: "sunilesports-ff-4f4ad",
            storageBucket: "sunilesports-ff-4f4ad.firebasestorage.app",
            messagingSenderId: "929173626716",
            appId: "1:929173626716:web:15b971ba5ab9197da26b99",
            measurementId: "G-0R3ZZ1VNSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'sunilesports-ff-4f4ad';

        // State Management
        let currentUser = null;
        let registrations = [];
        // AAPKA PERMANENT SCANNER LINK (DIRECT PNG)
        let scannerUrl = "https://accessible-gold-euwxs5d623.edgeone.app/AccountQRCodeNsdl%20Payments%20Bank%20Limited%20-%206448_DARK_THEME.png";
        let entryFee = "50";
        let googleSheetUrl = ""; 
        
        const dashboardPass = "125991sunil";   
        const settingsPassSecret = "73551109anil"; 

        let bTaps = 0; let bTimer = null;
        let sTaps = 0; let sTimer = null;
        let activeAction = null;
        let activeId = null;

        const getRegCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
        const getSettingsDoc = () => doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');

        // Auth & Initial Data
        async function startSystem() {
            try {
                await signInAnonymously(auth);
            } catch (e) { showMessage("Auth Error!", "error"); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) { 
                console.log("System Online");
                loadData(); 
                loadConfig(); 
            }
        });

        function loadConfig() {
            onSnapshot(getSettingsDoc(), (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    scannerUrl = d.scannerUrl || scannerUrl;
                    entryFee = d.entryFee || entryFee;
                    googleSheetUrl = d.googleSheetUrl || googleSheetUrl;
                    
                    document.getElementById('mainScanner').src = scannerUrl;
                    document.getElementById('displayFee').innerText = "₹" + entryFee;
                    document.getElementById('displayFeeText').innerText = "Scan & Pay ₹" + entryFee;
                }
            });
        }

        function loadData() {
            onSnapshot(getRegCol(), (snap) => {
                registrations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAdmin();
                document.getElementById('totalCount').innerText = registrations.length;
                document.getElementById('confCount').innerText = registrations.filter(r => r.status === 'Confirmed').length;
            }, (err) => {
                if(err.code === 'permission-denied') showMessage("Firestore Rules Check Karein!", "error");
            });
        }

        // Registration Submission
        window.submitRegistration = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            const data = {
                playerName: document.getElementById('playerName').value,
                gameUid: document.getElementById('gameUid').value,
                whatsapp: document.getElementById('whatsapp').value,
                village: document.getElementById('village').value,
                teamName: document.getElementById('teamName').value,
                payName: document.getElementById('payName').value, 
                utr: document.getElementById('utr').value,
                status: 'Pending', 
                syncedToSheet: false, 
                timestamp: serverTimestamp()
            };

            const file = document.getElementById('screenshot').files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                data.screenshot = ev.target.result; // Direct save base64
                try {
                    await addDoc(getRegCol(), data);
                    showMessage("Registration Successful! Verify ka intezar karein.", "success");
                    document.getElementById('regForm').reset();
                } catch (e) { showMessage("Permission Denied!", "error"); }
                finally { btn.disabled = false; btn.innerText = "Register Now"; }
            };
            reader.readAsDataURL(file);
        };

        window.handleStatus = async (id, status) => {
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'registrations', id);
                const snap = await getDoc(ref);
                const p = snap.data();

                if (status === 'Confirmed' && !p.syncedToSheet && googleSheetUrl) {
                    await fetch(googleSheetUrl, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({
                            date: new Date().toLocaleDateString("en-IN"),
                            time: new Date().toLocaleTimeString("en-IN"),
                            playerName: p.playerName,
                            gameUid: p.gameUid,
                            whatsapp: p.whatsapp,
                            utr: p.utr,
                            village: p.village,
                            teamName: p.teamName,
                            status: 'Confirmed'
                        }) 
                    });
                    await updateDoc(ref, { status, syncedToSheet: true });
                    showMessage("Confirmed & Synced to Sheet!", "success");
                } else {
                    await updateDoc(ref, { status });
                    showMessage("Status Updated!", "success");
                }
            } catch (e) { showMessage("Action Error!", "error"); }
        };

        // Modal Input Logic
        window.openInput = (type, id = null) => {
            activeAction = type; activeId = id;
            const m = document.getElementById('modalBox');
            const t = document.getElementById('modalTitle');
            const i = document.getElementById('modalInput');
            i.type = "text"; i.value = "";
            if (type === 'QR') { t.innerText = "Update QR Link"; i.value = scannerUrl; }
            else if (type === 'Fee') { t.innerText = "Update Fee"; i.value = entryFee; }
            else if (type === 'Sheet') { t.innerText = "Update Google Script URL"; i.value = googleSheetUrl; }
            else if (type === 'Delete') { t.innerText = "Admin Password for Delete"; i.type = "password"; }
            m.classList.remove('hidden'); m.classList.add('flex');
        };

        window.saveInput = async () => {
            const val = document.getElementById('modalInput').value.trim();
            if (!val) return;
            try {
                if (activeAction === 'Delete') {
                    if (val !== dashboardPass) return alert("Wrong Password!");
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registrations', activeId));
                    showMessage("Deleted!", "success");
                } else {
                    let up = {};
                    if (activeAction === 'QR') up.scannerUrl = val;
                    else if (activeAction === 'Fee') up.entryFee = val;
                    else if (activeAction === 'Sheet') up.googleSheetUrl = val;
                    await setDoc(getSettingsDoc(), up, { merge: true });
                    showMessage("Settings Saved!", "success");
                }
                document.getElementById('modalBox').classList.add('hidden');
            } catch (e) { showMessage("Permission Denied!", "error"); }
        };

        // Tap Handlers
        window.tapBuild = () => {
            clearTimeout(bTimer); bTaps++;
            bTimer = setTimeout(() => bTaps = 0, 1500);
            if (bTaps >= 10) { bTaps = 0; document.getElementById('dashModal').classList.remove('hidden'); document.getElementById('dashModal').classList.add('flex'); }
        };

        window.tapSettings = () => {
            clearTimeout(sTimer); sTaps++;
            sTimer = setTimeout(() => sTaps = 0, 1500);
            if (sTaps >= 10) { sTaps = 0; document.getElementById('secModal').classList.remove('hidden'); document.getElementById('secModal').classList.add('flex'); }
        };

        window.loginDash = () => {
            if (document.getElementById('passDash').value === dashboardPass) {
                document.getElementById('dashModal').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('regFormArea').classList.add('hidden');
                window.scrollTo(0,0);
            } else alert("Galat Password!");
        };

        window.loginSec = () => {
            if (document.getElementById('passSec').value === settingsPassSecret) {
                document.getElementById('secModal').classList.add('hidden');
                document.getElementById('setGroup').classList.remove('hidden');
                document.getElementById('setGroup').classList.add('flex');
            } else alert("Galat Secret Key!");
        };

        window.exitAdmin = () => {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('setGroup').classList.add('hidden');
            document.getElementById('regFormArea').classList.remove('hidden');
        };

        window.showImg = (id) => {
            const r = registrations.find(reg => reg.id === id);
            if (r && r.screenshot) {
                document.getElementById('bigImg').src = r.screenshot;
                document.getElementById('imgModal').classList.remove('hidden');
                document.getElementById('imgModal').classList.add('flex');
            }
        };

        function renderAdmin() {
            const tb = document.getElementById('adminTableBody');
            if (!tb) return;
            const sorted = registrations.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            tb.innerHTML = sorted.map((r, i) => `
                <tr class="border-b border-slate-800 text-[11px] hover:bg-slate-900/30">
                    <td class="p-3 text-center font-bold text-slate-500">${i + 1}</td>
                    <td class="p-3">
                        <div class="font-bold text-blue-400 uppercase">${r.playerName}</div>
                        <div class="text-[9px] text-slate-500 italic">${r.village}</div>
                    </td>
                    <td class="p-3 font-mono">
                        <div class="text-slate-300">UID: ${r.gameUid}</div>
                        <div class="text-yellow-500 font-bold">UTR: ${r.utr}</div>
                        <div class="text-pink-500 text-[9px] font-bold uppercase">${r.payName}</div>
                    </td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-0.5 rounded-full text-[8px] font-bold ${r.status==='Confirmed'?'bg-green-600':'bg-slate-700'}">${r.status}</span>
                    </td>
                    <td class="p-3 flex gap-1.5 justify-center items-center">
                        <button onclick="showImg('${r.id}')" class="bg-blue-600/20 text-blue-400 p-2 rounded-lg"><i data-lucide="eye" class="w-3.5"></i></button>
                        <button onclick="handleStatus('${r.id}', 'Confirmed')" class="bg-green-600 text-white p-2 rounded-lg shadow-lg"><i data-lucide="check" class="w-3.5"></i></button>
                        <button onclick="handleStatus('${r.id}', 'Rejected')" class="bg-red-600 text-white p-2 rounded-lg"><i data-lucide="x" class="w-3.5"></i></button>
                        <button onclick="openInput('Delete', '${r.id}')" class="bg-slate-800 text-slate-500 p-2 rounded-lg"><i data-lucide="trash-2" class="w-3.5"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function showMessage(m, t) {
            const toast = document.getElementById('toast');
            toast.innerText = m;
            toast.className = `fixed bottom-10 right-5 p-4 rounded-xl text-white font-bold z-[1000] transition-all duration-300 shadow-2xl ${t==='success'?'bg-green-600':'bg-red-600'}`;
            toast.style.opacity = "1";
            setTimeout(() => toast.style.opacity = "0", 3000);
        }

        window.onload = () => { startSystem(); lucide.createIcons(); };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;700&display=swap');
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-gaming { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen">

    <header class="p-5 border-b border-blue-900/20 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md text-center">
        <h1 class="text-xl md:text-2xl font-gaming font-black text-blue-500 uppercase italic tracking-widest">Sunil FF Pro V5</h1>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">
        
        <div id="regFormArea" class="animate-in fade-in duration-500">
            <div class="glass p-6 md:p-10 rounded-[3rem] shadow-2xl relative overflow-hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                    <div>
                        <h2 class="text-2xl font-gaming font-bold uppercase text-blue-400 mb-8 italic">Tournament Form</h2>
                        <form id="regForm" onsubmit="submitRegistration(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="playerName" placeholder="FF Name" required class="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500 text-white text-sm">
                                <input type="number" id="gameUid" placeholder="FF UID" required class="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500 text-white text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="whatsapp" placeholder="WhatsApp No." required pattern="[0-9]{10}" maxlength="10" class="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500 text-white text-sm">
                                <input type="text" id="village" placeholder="Village (Gaon)" required class="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500 text-white text-sm">
                            </div>
                            <input type="text" id="teamName" placeholder="Team Name (Optional)" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500 text-white text-sm">

                            <div class="p-6 bg-blue-600/5 rounded-[2.5rem] border border-blue-500/10 space-y-4 shadow-inner">
                                <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest text-center italic">Payment Verification</p>
                                <input type="text" id="payName" placeholder="App Name (PhonePe/Paytm Name)" required class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl outline-none focus:border-blue-500 text-center text-white text-sm">
                                <input type="text" id="utr" placeholder="12 Digit UTR Number" required pattern="[0-9]{12}" maxlength="12" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl outline-none focus:border-blue-500 font-mono text-center text-white text-sm tracking-widest">
                                <div class="flex items-center justify-center p-2 border border-dashed border-slate-800 rounded-xl">
                                    <input type="file" id="screenshot" accept="image/*" required class="text-[10px] text-slate-500 file:bg-blue-600 file:text-white file:px-3 file:py-1.5 file:rounded-lg">
                                </div>
                            </div>
                            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 py-5 rounded-[2rem] font-gaming font-black uppercase tracking-widest italic shadow-xl transition-all active:scale-95">Register Now</button>
                        </form>
                    </div>

                    <div class="flex flex-col items-center bg-slate-900/40 p-12 rounded-[4rem] border border-slate-800 shadow-inner">
                        <h3 id="displayFee" class="text-5xl font-gaming font-black text-white mb-2 italic">₹50</h3>
                        <p class="text-xs font-bold text-blue-500 uppercase mb-8 tracking-[0.3em]">Entry Fee</p>
                        <div class="bg-white p-5 rounded-[2.5rem] shadow-2xl mb-6">
                            <img id="mainScanner" src="https://accessible-gold-euwxs5d623.edgeone.app/AccountQRCodeNsdl%20Payments%20Bank%20Limited%20-%206448_DARK_THEME.png" alt="Scanner" class="w-48 h-48 rounded-xl object-contain">
                        </div>
                        <p id="displayFeeText" class="text-[10px] text-slate-500 uppercase font-bold tracking-widest font-gaming">Scan & Pay ₹50</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden space-y-6 animate-in slide-in-from-top-5 duration-500">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-3xl text-center shadow-lg">
                    <p id="totalCount" class="text-2xl font-gaming text-white">0</p>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Total Players</p>
                </div>
                <div class="glass p-5 rounded-3xl text-center border border-green-900/30">
                    <p id="confCount" class="text-2xl font-gaming text-green-400">0</p>
                    <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Confirmed</p>
                </div>
            </div>

            <div class="flex flex-wrap justify-between items-center bg-slate-900/95 p-6 rounded-[2.5rem] border border-blue-500/20 shadow-2xl gap-4">
                <div onclick="tapSettings()" class="cursor-pointer select-none p-2 hover:bg-white/5 rounded-xl active:scale-95 group">
                    <h2 class="text-xl font-gaming font-bold text-white uppercase italic tracking-widest border-b border-dashed border-blue-500/30 pb-1 group-hover:text-blue-400">Admin Dashboard</h2>
                </div>
                
                <div id="setGroup" class="hidden flex-wrap gap-2 animate-in fade-in duration-500">
                    <button onclick="openInput('Sheet')" class="bg-green-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition shadow-lg">Set Sheet</button>
                    <button onclick="openInput('Fee')" class="bg-indigo-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition shadow-lg">Fee</button>
                    <button onclick="openInput('QR')" class="bg-blue-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition shadow-lg">QR Link</button>
                </div>
                <button onclick="exitAdmin()" class="bg-slate-800 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Exit</button>
            </div>

            <div class="glass rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-800 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-950/50 text-[10px] uppercase font-black text-slate-500 border-b border-slate-800">
                        <tr><th class="p-4 text-center">S.No</th><th class="p-4">Details</th><th class="p-4">UID/UTR/App</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Action</th></tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800/40"></tbody>
                </table>
            </div>
        </div>

        <footer class="mt-20 text-center pb-16">
            <p onclick="tapBuild()" class="text-slate-800 text-[10px] font-bold uppercase tracking-[0.8em] cursor-pointer select-none hover:text-blue-500 transition-all py-4 px-8 inline-block">
                Build 1.4.1-Final-Master
            </p>
        </footer>
    </main>

    <!-- Modals -->
    <div id="dashModal" class="fixed inset-0 bg-slate-950/95 z-[500] hidden items-center justify-center p-6 backdrop-blur-3xl">
        <div class="glass w-full max-w-sm p-12 rounded-[3.5rem] text-center border-blue-500/20 shadow-2xl">
            <h3 class="text-2xl font-gaming font-black text-white mb-8 italic uppercase">Dashboard Access</h3>
            <input type="password" id="passDash" placeholder="Enter Password" class="w-full bg-slate-950 border border-slate-800 p-5 rounded-[1.5rem] text-center mb-6 text-white font-mono text-xl tracking-[0.3em] outline-none focus:border-blue-500">
            <div class="flex gap-4">
                <button onclick="loginDash()" class="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 transition">Unlock</button>
                <button onclick="document.getElementById('dashModal').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-400 py-4 rounded-2xl">Cancel</button>
            </div>
        </div>
    </div>

    <div id="secModal" class="fixed inset-0 bg-slate-950/98 z-[600] hidden items-center justify-center p-6 backdrop-blur-3xl">
        <div class="glass w-full max-w-sm p-12 rounded-[3.5rem] text-center border-indigo-500/20 shadow-2xl">
            <h3 class="text-xl font-gaming font-black text-white mb-6 uppercase italic">Secret Settings</h3>
            <input type="password" id="passSec" placeholder="Secret Key" class="w-full bg-slate-950 border border-slate-800 p-5 rounded-[1.5rem] text-center mb-6 text-white font-mono text-xl tracking-[0.3em] outline-none focus:border-indigo-500">
            <div class="flex gap-4">
                <button onclick="loginSec()" class="flex-1 bg-indigo-600 text-white font-black py-4 rounded-2xl active:scale-95 transition">Reveal</button>
                <button onclick="document.getElementById('secModal').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-400 py-4 rounded-2xl">Back</button>
            </div>
        </div>
    </div>

    <div id="modalBox" class="fixed inset-0 bg-slate-950/98 z-[700] hidden items-center justify-center p-6 backdrop-blur-3xl">
        <div class="glass w-full max-w-md p-10 rounded-[3rem] text-center shadow-2xl border-white/5">
            <h3 id="modalTitle" class="text-xl font-gaming font-black text-white mb-6 uppercase">Update</h3>
            <input type="text" id="modalInput" class="w-full bg-slate-950 border border-slate-800 p-5 rounded-2xl text-white text-center mb-8 outline-none focus:border-blue-500 text-sm">
            <div class="flex gap-4">
                <button onclick="saveInput()" class="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 transition">Save</button>
                <button onclick="document.getElementById('modalBox').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-400 py-4 rounded-2xl">Cancel</button>
            </div>
        </div>
    </div>

    <div id="imgModal" class="fixed inset-0 bg-slate-950/98 z-[800] hidden items-center justify-center p-4 md:p-12 backdrop-blur-3xl">
        <button onclick="document.getElementById('imgModal').classList.add('hidden')" class="absolute top-8 right-8 text-white bg-red-600 p-4 rounded-2xl shadow-2xl active:scale-90 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
        <img id="bigImg" src="" alt="Screenshot" class="max-w-full max-h-[85vh] rounded-[2.5rem] shadow-2xl border border-white/10 object-contain">
    </div>

    <div id="toast" class="opacity-0 pointer-events-none translate-y-10 shadow-2xl"></div>
</body>
</html>
